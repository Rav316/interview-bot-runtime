name: verify
on:
  workflow_dispatch:
jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Clone private code
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CODE_DEPLOY_KEY }}" > ~/.ssh/code_key
          chmod 600 ~/.ssh/code_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/code_key -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 "git@github.com:${{ vars.CODE_REPO }}.git" app
          echo "OK: коммит $(git -C app rev-parse --short HEAD), файлов $(find app -type f | wc -l)"
          test -f app/main.py && echo "main.py на месте"
          test -f app/.github/scripts/db_sync.sh && echo "db_sync.sh на месте"
          test -d app/content && echo "карточек: $(ls app/content/*.yaml | wc -l)"
